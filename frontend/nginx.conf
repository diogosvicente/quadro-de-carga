server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota desconhecida cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API: proxy para o backend Spring Boot
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Enquanto a API reinicia (deploy) ou está fora do ar, o nginx gera 502/504 em HTML,
        # que na tela virava o críptico "Erro 502 ao chamar a API". Responde no MESMO envelope
        # JSON da API, para o app exibir uma mensagem que o usuário entende.
        # proxy_intercept_errors fica desligado (padrão) de proposito: assim os erros legitimos
        # da API (400/404/422) passam intactos e so os gerados pelo nginx caem aqui.
        error_page 502 503 504 = @api_indisponivel;
    }

    location @api_indisponivel {
        default_type application/json;
        return 503 '{"status":503,"mensagem":"O servidor esta reiniciando. Aguarde alguns segundos e tente novamente.","erros":null}';
    }
}
