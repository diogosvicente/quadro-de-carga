services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eletrica
      POSTGRES_USER: eletrica
      POSTGRES_PASSWORD: eletrica
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eletrica -d eletrica"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/eletrica
      SPRING_DATASOURCE_USERNAME: eletrica
      SPRING_DATASOURCE_PASSWORD: eletrica
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8086:8080"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8085:80"

volumes:
  pgdata:
